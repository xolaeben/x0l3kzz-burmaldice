<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X0L3KZZ DICE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #65dce8;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
}

h1 {
  font-size: 32px;
  text-shadow: 2px 2px 4px black;
}

.layout {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 30px;
  flex-wrap: wrap;
}

main {
  width: 100%;
  max-width: 440px;
}

.dice {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  width: 100%;
  margin: 30px auto;
}

.die {
  width: 100%;
  aspect-ratio: 1;
  background: #f44336;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dot {
  width: 22%;
  aspect-ratio: 1;
  background: white;
  border-radius: 50%;
}

button {
  background: #222;
  color: white;
  border: 3px solid white;
  border-radius: 12px;
  padding: 15px 35px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

.history {
  margin: 25px auto;
  max-width: 400px;
  background: rgba(0,0,0,.18);
  padding: 12px;
  border-radius: 12px;
}

.history-item {
  padding: 5px;
  border-bottom: 1px solid rgba(255,255,255,.25);
}

.phrases img {
  width: 230px;
  max-width: 90vw;
  height: auto;
}

@media (max-width: 650px) {
  .layout {
    flex-direction: column;
    align-items: center;
  }

  main {
    max-width: 440px;
  }
}
</style>
</head>

<body>

<h1>X0L3KZZ DICE</h1>

<div class="layout">

<main>
  <div class="dice">
    <div class="die"><div class="dot"></div></div>
    <div class="die"><div class="dot"></div></div>
    <div class="die"><div class="dot"></div></div>
    <div class="die"><div class="dot"></div></div>
  </div>

  <button id="rollButton">ROLL DICE</button>

  <div class="history">
    <h2>HISTORY</h2>
    <div id="history">No rolls yet</div>
  </div>
</main>

<aside class="phrases">
  <img src="dice-phrases.svg" alt="Trading phrases">
</aside>

</div>

<script>
const colors = [
  "#f44336",
  "#ff9800",
  "#ffeb3b",
  "#4caf50",
  "#2196f3",
  "#9c27b0"
];

let rolls = 0;
let rollHistory = [];

function rollDice() {
  rolls++;

  const special = rolls % 9 === 0;

  const amount = special
    ? 3 + Math.floor(Math.random() * 2)
    : 2 + Math.floor(Math.random() * 2);

  const shuffledColors = [...colors];

  for (let i = shuffledColors.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledColors[i], shuffledColors[j]] =
      [shuffledColors[j], shuffledColors[i]];
  }

  const selected = shuffledColors.slice(0, amount);

  const result = [];

  for (let i = 0; i < 4; i++) {
    result.push(selected[i % selected.length]);
  }

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  const dice = document.querySelectorAll(".die");

  dice.forEach((die, i) => {
    die.style.backgroundColor = result[i];
  });

  const names = result.map(color =>
    colors.indexOf(color) + 1
  );

  rollHistory.unshift(names);

  if (rollHistory.length > 25) {
    rollHistory.pop();
  }

  document.getElementById("history").innerHTML =
    rollHistory.map((item, index) =>
      <div class="history-item">${rollHistory.length - index}. ${item.join(" - ")}</div>
    ).join("");
}

document.getElementById("rollButton")
  .addEventListener("click", rollDice);
</script>

</body>
</html>
