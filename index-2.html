<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X0L3KZZ DICE</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 34px;
    background: #65dce8; font-family: Arial, sans-serif; color: white;
  }
  h1 { margin: 0; font-size: clamp(30px, 7vw, 54px); letter-spacing: 3px; }
  .dice-area {
    display: flex; justify-content: center; align-items: center;
    flex-wrap: wrap; gap: 18px; padding: 24px;
    background: rgba(255,255,255,.22); border: 5px solid white;
    border-radius: 24px; width: min(92vw, 650px); min-height: 190px;
  }
  .die {
    width: 105px; height: 105px; border-radius: 20px;
    display: grid; place-items: center;
    box-shadow: 0 7px 0 rgba(0,0,0,.13);
    transition: background-color .18s ease, transform .18s ease;
  }
  .dot {
    width: 15px; height: 15px; border-radius: 50%;
    background: white;
  }
  button {
    border: 0; border-radius: 15px; padding: 17px 38px;
    background: white; color: #28aebb; font-size: 20px;
    font-weight: 800; letter-spacing: 1px; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.13);
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.13); }
  @media (max-width: 420px) {
    .die { width: 78px; height: 78px; border-radius: 15px; }
    .dice-area { gap: 12px; padding: 18px; }
  }
</style>
</head>
<body>
  <h1>X0L3KZZ DICE</h1>
  <main class="dice-area" aria-label="Четыре цветных кубика">
    <div class="die"><span class="dot"></span></div>
    <div class="die"><span class="dot"></span></div>
    <div class="die"><span class="dot"></span></div>
    <div class="die"><span class="dot"></span></div>
  </main>
  <button id="roll">ROLL DICE</button>
<script>
  const colors = ["#f44336", "#ff9800", "#ffeb3b", "#4caf50", "#2196f3", "#9c27b0"];
  const dice = Array.from(document.querySelectorAll(".die"));
  function rollDice() {
    dice.forEach((die, index) => {
      die.animate(
        [{ transform: "rotate(0deg) scale(1)" },
         { transform: "rotate(12deg) scale(1.08)" },
         { transform: "rotate(-12deg) scale(.96)" },
         { transform: "rotate(0deg) scale(1)" }],
        { duration: 420, delay: index * 35, easing: "ease-in-out" }
      );
      die.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    });
  }
  document.getElementById("roll").addEventListener("click", rollDice);
  rollDice();
</script>
</body>
</html>
