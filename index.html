<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X0L3KZZ DICE</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #65dce8;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
}

h1 {
  font-size: 32px;
  text-shadow: 2px 2px 4px black;
}

.layout {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 30px;
  flex-wrap: wrap;
}

main { max-width: 500px; }

.dice {
  display: grid;
  grid-template-columns: repeat(2, 110px);
  gap: 15px;
  justify-content: center;
  margin: 25px 0;
}

.die {
  width: 110px;
  height: 110px;
  background: white;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dot {
  width: 18px;
  height: 18px;
  background: #222;
  border-radius: 50%;
}

button {
  background: #222;
  color: white;
  border: 3px solid white;
  border-radius: 12px;
  padding: 15px 35px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

button:active { transform: scale(.96); }

.history {
  margin: 25px auto;
  max-width: 400px;
  background: rgba(0,0,0,.18);
  padding: 12px;
  border-radius: 12px;
}

.history-item {
  padding: 5px;
  border-bottom: 1px solid rgba(255,255,255,.25);
}

.phrases img {
  width: 230px;
  max-width: 90vw;
  height: auto;
}

@media (max-width: 650px) {
  .layout { flex-direction: column; align-items: center; }
}
</style>
</head>
<body>

<h1>X0L3KZZ DICE</h1>

<div class="layout">
<main>
  <div class="dice" id="dice">
    <div class="die"><div class="dot"></div></div>
    <div class="die"><div class="dot"></div></div>
    <div class="die"><div class="dot"></div></div>
    <div class="die"><div class="dot"></div></div>
  </div>

  <button onclick="rollDice()">ROLL DICE</button>

  <div class="history">
    <h2>HISTORY</h2>
    <div id="history">No rolls yet</div>
  </div>
</main>

<aside class="phrases">
  <img src="dice-phrases.svg" alt="Trading phrases">
</aside>
</div>

<script>
const colors = [
  "#f44336",
  "#ff9800",
  "#ffeb3b",
  "#4caf50",
  "#2196f3",
  "#9c27b0"
];

let rolls = 0;
let history = [];

function rollDice() {
  rolls++;

  // Каждый 9-й бросок: 3 или 4 разных цвета.
  // Остальные: 2 или 3 разных цвета.
  const special = rolls % 9 === 0;
  const amount = special
    ? 3 + Math.floor(Math.random() * 2)
    : 2 + Math.floor(Math.random() * 2);

  const selected = [...colors]
    .sort(() => Math.random() - 0.5)
    .slice(0, amount);

  const result = [];

  for (let i = 0; i < 4; i++) {
    result.push(selected[i % selected.length]);
  }

  // Перемешиваем цвета на кубиках.
  result.sort(() => Math.random() - 0.5);

  const dice = document.querySelectorAll(".die");

  dice.forEach((die, i) => {
    die.style.background = result[i];
  });

  const names = result.map(color =>
    colors.indexOf(color) + 1
  );

  history.unshift(names);
  if (history.length > 25) history.pop();

  document.getElementById("history").innerHTML =
    history.map((item, index) =>
      <div class="history-item">${history.length - index}. ${item.join(" - ")}</div>
    ).join("");
}
</script>

</body>
</html>
