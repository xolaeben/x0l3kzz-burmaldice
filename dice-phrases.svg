<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">
  <rect width="300" height="450" rx="20" fill="#65dce8"/>

  <g font-family="Arial, sans-serif" font-size="23" font-weight="bold"
     text-anchor="middle" fill="white"
     stroke="black" stroke-width="2.5" paint-order="stroke">
    
    <rect x="10" y="10" width="280" height="60" rx="12" fill="#2196f3" stroke="black" stroke-width="4"/>
    <text x="150" y="48">Add more</text>

    <rect x="10" y="83" width="280" height="60" rx="12" fill="#f44336" stroke="black" stroke-width="4"/>
    <text x="150" y="121">L Trade</text>

    <rect x="10" y="156" width="280" height="60" rx="12" fill="#9c27b0" stroke="black" stroke-width="4"/>
    <text x="150" y="194">Last offer</text>

    <rect x="10" y="229" width="280" height="60" rx="12" fill="#ffeb3b" stroke="black" stroke-width="4"/>
    <text x="150" y="267">Deal</text>

    <rect x="10" y="302" width="280" height="60" rx="12" fill="#4caf50" stroke="black" stroke-width="4"/>
    <text x="150" y="340">Fair Trade</text>

    <rect x="10" y="375" width="280" height="60" rx="12" fill="#ff9800" stroke="black" stroke-width="4"/>
    <text x="150" y="413">No thanks</text>
  </g>
</svg>
