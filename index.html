<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X0L3KZZ DICE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: #17172c;
  background-attachment: fixed;
  transition: background 0.4s;
}

body.cosmos {
  background: radial-gradient(ellipse at top, #673ab7, #15102e 65%, #050511);
}

body.neon {
  background: linear-gradient(135deg, #090019, #17104a, #001e35);
}

body.winter {
  background: linear-gradient(135deg, #d6f4ff, #438bc5, #142d58);
}

body.summer {
  background: linear-gradient(135deg, #ffe66d, #ff9b42, #27b9a1);
}

body.hell {
  background: radial-gradient(ellipse at bottom, #ff4b00, #720000 45%, #170000);
}

body.heaven {
  background: linear-gradient(135deg, #e7f8ff, #9bceff, #f5d8ff);
}

body.king {
  background:
    radial-gradient(circle at 50% 20%, #b58a36, transparent 35%),
    linear-gradient(135deg, #100b27, #44216b, #100b27);
}

h1 {
  font-size: clamp(30px, 7vw, 48px);
  letter-spacing: 4px;
  color: #fff1bd;
  text-shadow: 0 0 10px #e6b84e, 0 0 25px #9b5bff,
               3px 3px 4px black;
  margin: 15px 0 25px;
}

.theme-box {
  margin: 15px auto 25px;
}

.theme-box h2 {
  font-size: 19px;
  letter-spacing: 2px;
}

select {
  width: 220px;
  max-width: 90%;
  padding: 13px;
  border: 2px solid white;
  border-radius: 12px;
  background: #17152b;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.layout {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 25px;
  flex-wrap: wrap;
}

main {
  width: 100%;
  max-width: 440px;
}

.dice {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 30px auto;
}

.die {
  aspect-ratio: 1;
  min-width: 0;
  border-radius: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
}

.dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
}

button {
  padding: 15px 35px;
  background: #222;
  color: white;
  border: 3px solid white;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

.history {
  margin: 25px auto;
  padding: 12px;
  background: rgba(0,0,0,.25);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 12px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 8px 3px;
  border-bottom: 1px solid rgba(255,255,255,.25);
}

.history-roll {
  display: flex;
  gap: 5px;
}

.history-die {
  width: 23px;
  height: 23px;
  border-radius: 5px;
  border: 1px solid white;
}

.phrases img {
  width: 230px;
  max-width: 90vw;
}

.king-decoration {
  display: none;
  margin: 15px auto;
  font-size: 45px;
  text-shadow: 0 0 15px gold;
}

body.king .king-decoration {
  display: block;
}

body.heaven {
  color: #172b50;
}

body.winter {
  color: #102d4d;
}

body.summer {
  color: #422600;
}

@media(max-width:650px) {
  .layout {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body class="cosmos">

<h1>X0L3KZZ DICE</h1>

<div class="theme-box">
  <h2>BACKGROUND</h2>

  <select id="themeSelect" onchange="changeTheme(this.value)">
    <option value="cosmos">🌌 COSMOS</option>
    <option value="neon">💜 NEON</option>
    <option value="winter">❄️ WINTER</option>
    <option value="summer">☀️ SUMMER</option>
    <option value="hell">🔥 HELL</option>
    <option value="heaven">😇 HEAVEN</option>
    <option value="king">👑 KING</option>
  </select>
</div>

<div class="king-decoration">👑 ✨ 👑</div>

<div class="layout">
<main>

<div class="dice">
  <div class="die"><div class="dot"></div></div>
  <div class="die"><div class="dot"></div></div>
  <div class="die"><div class="dot"></div></div>
  <div class="die"><div class="dot"></div></div>
</div>

<button type="button" onclick="rollDice()">ROLL DICE</button>
<div class="history">
  <h2>HISTORY</h2>
  <div id="history">No rolls yet</div>
</div>

</main>

<aside class="phrases">
  <img src="dice-phrases.svg" alt="Trading phrases">
</aside>
</div>

<script>
var colors = [
  "#f44336",
  "#ff9800",
  "#ffeb3b",
  "#4caf50",
  "#2196f3",
  "#9c27b0"
];

var rolls = 0;
var rollHistory = [];

function changeTheme(theme) {
  var allowed = [
    "cosmos", "neon", "winter",
    "summer", "hell", "heaven", "king"
  ];

  if (!allowed.includes(theme)) return;

  document.body.className = theme;

  try {
    localStorage.setItem("x0l3kzzTheme", theme);
  } catch (e) {}
}

try {
  var savedTheme = localStorage.getItem("x0l3kzzTheme");

  if (savedTheme) {
    changeTheme(savedTheme);
    document.getElementById("themeSelect").value = savedTheme;
  }
} catch (e) {}

function rollDice() {
  rolls++;

  var special = rolls % 9 === 0;

  var amount = special
    ? 3 + Math.floor(Math.random() * 2)
    : 2 + Math.floor(Math.random() * 2);

  var pool = colors.slice();

  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = pool[i];
    pool[i] = pool[j];
    pool[j] = temp;
  }

  var selected = pool.slice(0, amount);
  var result = [];

  for (var i = 0; i < 4; i++) {
    result.push(selected[i % amount]);
  }

  for (var i = result.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = result[i];
    result[i] = result[j];
    result[j] = temp;
  }

  var dice = document.querySelectorAll(".die");

  for (var i = 0; i < 4; i++) {
    dice[i].style.backgroundColor = result[i];
  }

  var numbers = result.map(function(color) {
    return colors.indexOf(color) + 1;
  });

  rollHistory.unshift({
    numbers: numbers,
    colors: result.slice()
  });

  if (rollHistory.length > 25) {
    rollHistory.pop();
  }

  var historyHTML = "";

  for (var i = 0; i < rollHistory.length; i++) {
    var item = rollHistory[i];

    historyHTML +=
      '<div class="history-item">' +
      '<span>' + (rolls - i) + '.</span>' +
      '<span>' + item.numbers.join(" - ") + '</span>' +
      '<div class="history-roll">';

    for (var j = 0; j < 4; j++) {
      historyHTML +=
        '<div class="history-die" style="background:' +
        item.colors[j] + '"></div>';
    }

    historyHTML += '</div></div>';
  }

  document.getElementById("history").innerHTML = historyHTML;
}
</script>

</body>
</html>
