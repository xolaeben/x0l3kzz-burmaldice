<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X0L3KZZ DICE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  transition: background-image .4s;
  background-color: #15102e;
}

/* THEMES */

body.cosmos {
  background-image:
    linear-gradient(rgba(10,5,35,.35),rgba(10,5,35,.55)),
    url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1600");
}

body.neon {
  background-image:
    linear-gradient(rgba(5,0,20,.4),rgba(5,0,20,.55)),
    url("https://images.unsplash.com/photo-1535223289827-42f1e9919769?w=1600");
}

body.winter {
  background-image:
    linear-gradient(rgba(5,35,65,.2),rgba(5,35,65,.4)),
    url("https://images.unsplash.com/photo-1418985991508-e47386d96a71?w=1600");
}

body.summer {
  background-image:
    linear-gradient(rgba(50,30,0,.15),rgba(50,30,0,.35)),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600");
}

body.hell {
  background-image:
    linear-gradient(rgba(40,0,0,.3),rgba(40,0,0,.55)),
    url("https://images.unsplash.com/photo-1475738198235-4b30fc6a2d9c?w=1600");
}

body.heaven {
  background-image:
    linear-gradient(rgba(30,50,90,.15),rgba(30,50,90,.3)),
    url("https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=1600");
}

body.king {
  background-image:
    linear-gradient(rgba(15,5,25,.3),rgba(15,5,25,.55)),
    url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600");
}

/* HEADER */

h1 {
  font-size: clamp(30px, 7vw, 48px);
  letter-spacing: 4px;
  color: #fff0bd;
  text-shadow:
    0 0 10px #e6b84e,
    0 0 25px #a34dff,
    3px 3px 4px black;
  margin: 15px 0 25px;
}

body.king h1 {
  color: #ffd76b;
  text-shadow: 0 0 15px gold, 0 0 30px orange;
}

/* BACKGROUND SELECTOR */

.theme-box {
  margin: 15px auto 25px;
}

.theme-box h2 {
  font-size: 19px;
  letter-spacing: 2px;
  text-shadow: 2px 2px 4px black;
}

select {
  width: 230px;
  max-width: 90%;
  padding: 13px;
  border: 2px solid white;
  border-radius: 12px;
  background: #17152b;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

/* LAYOUT */

.layout {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 25px;
  flex-wrap: wrap;
}

main {
  width: 100%;
  max-width: 440px;
}

/* DICE */

.dice {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 30px auto;
}

.die {
  aspect-ratio: 1;
  min-width: 0;
  border-radius: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
}

.dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
}

/* BUTTON */

button {
  padding: 15px 35px;
  background: #17121f;
  color: white;
  border: 3px solid white;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

/* HISTORY */

.history {
  margin: 25px auto;
  padding: 12px;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 12px;
}

.history h2 {
  text-shadow: 2px 2px 4px black;
}

.history-item {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 9px;
  border-bottom: 1px solid rgba(255,255,255,.25);
}

.history-roll {
  display: flex;
  justify-content: center;
  gap: 7px;
}

.history-die {
  width: 27px;
  height: 27px;
  border-radius: 6px;
  border: 2px solid white;
}

/* KING DECORATION */

.king-decoration {
  display: none;
  font-size: 35px;
  margin: 10px;
  text-shadow: 0 0 15px gold;
}

body.king .king-decoration {
  display: block;
}

.phrases img {
  width: 230px;
  max-width: 90vw;
}

@media(max-width:650px) {
  .layout {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body class="cosmos">

<h1>X0L3KZZ DICE</h1>
<div class="theme-box">
  <h2>BACKGROUND</h2>

  <select id="themeSelect" onchange="changeTheme(this.value)">
    <option value="cosmos">🌌 COSMOS</option>
    <option value="neon">💜 NEON</option>
    <option value="winter">❄️ WINTER</option>
    <option value="summer">☀️ SUMMER</option>
    <option value="hell">🔥 HELL</option>
    <option value="heaven">😇 HEAVEN</option>
    <option value="king">👑 KING</option>
  </select>
</div>

<div class="king-decoration">👑 ✨ 👑</div>

<div class="layout">

<main>

<div class="dice">
  <div class="die"><div class="dot"></div></div>
  <div class="die"><div class="dot"></div></div>
  <div class="die"><div class="dot"></div></div>
  <div class="die"><div class="dot"></div></div>
</div>

<button type="button" onclick="rollDice()">
  ROLL DICE
</button>

<div class="history">
  <h2>HISTORY</h2>
  <div id="history">No rolls yet</div>
</div>

</main>

<aside class="phrases">
  <img src="dice-phrases.svg" alt="Trading phrases">
</aside>

</div>

<script>

var colors = [
  "#f44336",
  "#ff9800",
  "#ffeb3b",
  "#4caf50",
  "#2196f3",
  "#9c27b0"
];

var rolls = 0;
var rollHistory = [];

/* CHANGE BACKGROUND */

function changeTheme(theme) {
  var allowed = [
    "cosmos",
    "neon",
    "winter",
    "summer",
    "hell",
    "heaven",
    "king"
  ];

  if (!allowed.includes(theme)) return;

  document.body.className = theme;

  try {
    localStorage.setItem("x0l3kzzTheme", theme);
  } catch(e) {}
}

/* LOAD SAVED BACKGROUND */

try {
  var savedTheme = localStorage.getItem("x0l3kzzTheme");

  if (savedTheme) {
    changeTheme(savedTheme);
    document.getElementById("themeSelect").value = savedTheme;
  }
} catch(e) {}

/* ROLL DICE */

function rollDice() {

  rolls++;

  var special = rolls % 9 === 0;

  var amount = special
    ? 3 + Math.floor(Math.random() * 2)
    : 2 + Math.floor(Math.random() * 2);

  var pool = colors.slice();

  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = pool[i];
    pool[i] = pool[j];
    pool[j] = temp;
  }

  var selected = pool.slice(0, amount);
  var result = [];

  for (var i = 0; i < 4; i++) {
    result.push(selected[i % amount]);
  }

  for (var i = result.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = result[i];
    result[i] = result[j];
    result[j] = temp;
  }

  var dice = document.querySelectorAll(".die");

  for (var i = 0; i < 4; i++) {
    dice[i].style.backgroundColor = result[i];
  }

  /* SAVE HISTORY */

  rollHistory.unshift(result.slice());

  if (rollHistory.length > 25) {
    rollHistory.pop();
  }

  /* HISTORY - ONLY COLORED SQUARES */

  var historyHTML = "";

  for (var i = 0; i < rollHistory.length; i++) {

    historyHTML += '<div class="history-item">';
    historyHTML += '<div class="history-roll">';

    for (var j = 0; j < 4; j++) {
      historyHTML +=
        '<div class="history-die" style="background:' +
        rollHistory[i][j] +
        '"></div>';
    }

    historyHTML += '</div>';
    historyHTML += '</div>';
  }

  document.getElementById("history").innerHTML = historyHTML;
}

</script>

</body>
</html>
