<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X0L3KZZ DICE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #65dce8;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
}

h1 {
  text-shadow: 2px 2px 4px black;
}

.layout {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 25px;
  flex-wrap: wrap;
}

main {
  width: 100%;
  max-width: 440px;
}

.dice {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 30px auto;
}

.die {
  aspect-ratio: 1;
  min-width: 0;
  border-radius: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
}

.dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
}

button {
  padding: 15px 35px;
  background: #222;
  color: white;
  border: 3px solid white;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.history {
  margin: 25px auto;
  padding: 12px;
  background: rgba(0,0,0,.18);
  border-radius: 12px;
}

.history-item {
  padding: 5px;
  border-bottom: 1px solid rgba(255,255,255,.25);
}

.phrases img {
  width: 230px;
  max-width: 90vw;
}

@media(max-width:650px) {
  .layout {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<h1>X0L3KZZ DICE</h1>

<div class="layout">
<main>

<div class="dice">
  <div class="die"><div class="dot"></div></div>
  <div class="die"><div class="dot"></div></div>
  <div class="die"><div class="dot"></div></div>
  <div class="die"><div class="dot"></div></div>
</div>

<button type="button" onclick="rollDice()">ROLL DICE</button>

<div class="history">
  <h2>HISTORY</h2>
  <div id="history">No rolls yet</div>
</div>

</main>

<aside class="phrases">
  <img src="dice-phrases.svg" alt="Trading phrases">
</aside>
</div>

<script>
var colors = [
  "#f44336",
  "#ff9800",
  "#ffeb3b",
  "#4caf50",
  "#2196f3",
  "#9c27b0"
];

var rolls = 0;
var rollHistory = [];

function rollDice() {
  rolls++;

  var special = rolls % 9 === 0;
  var amount = special
    ? 3 + Math.floor(Math.random() * 2)
    : 2 + Math.floor(Math.random() * 2);

  var pool = colors.slice();

  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = pool[i];
    pool[i] = pool[j];
    pool[j] = temp;
  }

  var selected = pool.slice(0, amount);
  var result = [];

  for (var i = 0; i < 4; i++) {
    result.push(selected[i % amount]);
  }

  for (var i = result.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = result[i];
    result[i] = result[j];
    result[j] = temp;
  }

  var dice = document.querySelectorAll(".die");

  for (var i = 0; i < 4; i++) {
    dice[i].style.backgroundColor = result[i];
  }

  var numbers = result.map(function(color) {
    return colors.indexOf(color) + 1;
  });

  rollHistory.unshift(numbers);

  if (rollHistory.length > 25) {
    rollHistory.pop();
  }

  var historyHTML = "";

  for (var i = 0; i < rollHistory.length; i++) {
    historyHTML += '<div class="history-item">' +
      (rollHistory.length - i) + '. ' +
      rollHistory[i].join(" - ") +
      '</div>';
  }

  document.getElementById("history").innerHTML = historyHTML;
}
</script>

</body>
</html>
<script>
function rollDice() {
  const colors = [
    "#f44336",
    "#ff9800",
    "#ffeb3b",
    "#4caf50",
    "#2196f3",
    "#9c27b0"
  ];

  const dice = document.querySelectorAll(".die");
  const special = (window.rolls = (window.rolls || 0) + 1) % 9 === 0;
  const count = special
    ? 3 + Math.floor(Math.random() * 2)
    : 2 + Math.floor(Math.random() * 2);

  const chosen = colors.sort(() => Math.random() - 0.5).slice(0, count);
  const result = [];

  for (let i = 0; i < 4; i++) {
    result.push(chosen[i % count]);
  }

  result.sort(() => Math.random() - 0.5);

  dice.forEach((die, i) => {
    die.style.backgroundColor = result[i];
  });
}
</script>
